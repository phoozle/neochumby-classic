# neochumby-classic with Docker, instead of install.sh. neochumbyd itself runs on the host.
#
#   CLASSIC_UID=$(id -u neochumby-classic) NEOCHUMBYD_GID=$(getent group neochumbyd | cut -d: -f3) \
#   CLASSIC_WEB_ADDR=<the server's LAN address> docker compose up -d
#
# Both containers run as a user of their own (CLASSIC_UID: the `neochumby-classic` user, or
# any uid nothing else uses), never as neochumbyd's. Their group is neochumbyd's
# (NEOCHUMBYD_GID), and no other: the renders then belong to that group, so neochumbyd's
# companion can read them, and the admin socket can let that group in.
#
# Nothing of neochumbyd's state directory is mounted: not its key, its pairings or its owner
# token. The containers see only:
#   - neochumbyd's admin socket, the one file, bound on its own (NEOCHUMBYD_ADMIN). neochumbyd
#     answers it only for its own user and root (neochumby PR #9) until it also lets its group
#     in; until then the Chumbys page can't pair or set anything, and the renderer needs the
#     Chumbys named (NEOCHUMBY_CLASSIC_CHUMBYS: "kitchen lounge" in its environment, in a
#     docker-compose.override.yml). neochumbyd makes the socket again when it restarts, and
#     a bind keeps the old one: `docker compose restart` after restarting neochumbyd.
#   - neochumbyd's app tree, read-only (NEOCHUMBYD_TREE), for the start apps and Home's APPS.
#     It is what neochumbyd serves to any Chumby over NFS anyway.
#
# Before the first start:
#   sudo useradd --system --no-create-home --shell /usr/sbin/nologin neochumby-classic
#   sudo install -d -o neochumby-classic -g neochumbyd -m 2750 /var/lib/neochumby-classic \
#     /var/lib/neochumby-classic/out
#   sudo install -d -o neochumby-classic -g neochumbyd -m 2770 /var/lib/neochumby-classic/refresh \
#     /var/lib/neochumby-classic/info
#   neochumbyd token > owner-token && sudo chown neochumby-classic owner-token && sudo chmod 400 owner-token
#
# The web page is published on CLASSIC_WEB_ADDR only, the server's LAN address (or another
# you choose), never on every interface. Inside its container it listens on 0.0.0.0:8080,
# which is the container's own network, not the host's.
x-classic: &classic
  build: .
  user: "${CLASSIC_UID:?set CLASSIC_UID}:${NEOCHUMBYD_GID:?set NEOCHUMBYD_GID}"
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # The paths inside are the Dockerfile's.
  volumes:
    - ${CLASSIC_STATE:-/var/lib/neochumby-classic}:/state
    - type: bind
      source: ${NEOCHUMBYD_ADMIN:-/var/lib/neochumbyd/admin.sock}
      target: /run/neochumbyd/admin.sock
      bind:
        # Missing, Docker would make a directory in its place, where neochumbyd's socket goes.
        create_host_path: false
    - type: bind
      source: ${NEOCHUMBYD_TREE:-/var/lib/neochumbyd/tree}
      target: /tree
      read_only: true
    - ${CLASSIC_ASSETS:-/etc/neochumby-classic/assets}:/assets:ro

services:
  renderer:
    <<: *classic
    command: ["neochumby-classic-renderer"]
  web:
    <<: *classic
    command: ["neochumby-classic-web"]
    ports:
      - "${CLASSIC_WEB_ADDR:?set CLASSIC_WEB_ADDR to the server's LAN address}:${CLASSIC_WEB_PORT:-8080}:8080"
    environment:
      NEOCHUMBY_CLASSIC_OWNER_TOKEN_FILE: /run/secrets/owner-token
    secrets:
      - owner-token

secrets:
  owner-token:
    file: ./owner-token
